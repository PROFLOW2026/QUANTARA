name: Broker Integration Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  broker-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BROKER_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5433/postgres
      BROKER_TEST_DATABASE_URL: postgresql://quantara:quantara@127.0.0.1:5433/quantara_broker_test
      DATABASE_URL: ""
      DIRECT_URL: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install engine dependencies
        run: pip install -e "./apps/engine[dev]"

      - name: Wait for PostgreSQL
        run: |
          python -c "import os, time, psycopg2; url=os.environ['BROKER_TEST_ADMIN_URL'];
          import sys
          for i in range(30):
              try:
                  psycopg2.connect(url).close()
                  print('postgres ready', url, flush=True)
                  sys.exit(0)
              except Exception as exc:
                  print(f'wait {i}: {exc}', flush=True)
                  time.sleep(1)
          raise SystemExit('postgres never became ready')"

      - name: Provision broker test database
        working-directory: apps/engine
        run: python -c "from tests.broker_integration_support import _provision_local_database; url = _provision_local_database(); print('provisioned', url); assert url"

      - name: Run broker integration tests
        working-directory: apps/engine
        run: pytest tests/test_broker_execution_integration.py -v --tb=short
