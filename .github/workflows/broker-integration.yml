name: Broker Integration Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  broker-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BROKER_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5433/postgres
      BROKER_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/quantara_broker_test
      BROKER_TEST_DB_NAME: quantara_broker_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: "3.12"

      - name: Install engine dependencies
        run: pip install -e "./apps/engine[dev]" pandas

      - name: Wait for PostgreSQL
        run: |
          python -c "import os, time, psycopg2; url=os.environ['BROKER_TEST_ADMIN_URL'];
          import sys
          for i in range(30):
              try:
                  psycopg2.connect(url).close()
                  print('postgres ready', url, flush=True)
                  sys.exit(0)
              except Exception as exc:
                  print(f'wait {i}: {exc}', flush=True)
                  time.sleep(1)
          raise SystemExit('postgres never became ready')"

      - name: Prepare broker test database role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 5433 -U postgres -d postgres -v ON_ERROR_STOP=1 -c \
            "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'quantara') THEN CREATE ROLE quantara LOGIN PASSWORD 'quantara'; END IF; END \$\$;"
          psql -h 127.0.0.1 -p 5433 -U postgres -d postgres -v ON_ERROR_STOP=1 -c \
            "ALTER ROLE quantara CREATEDB;"

      - name: Run engine unit tests (V2/V3 validation)
        working-directory: apps/engine
        run: pytest tests/test_live_sim_v2.py tests/test_attribution_orphan_link.py -q --tb=short

      - name: Ensure broker test database exists
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 5433 -U postgres -d postgres -v ON_ERROR_STOP=1 -tc \
            "SELECT 1 FROM pg_database WHERE datname = 'quantara_broker_test'" | grep -q 1 || \
          psql -h 127.0.0.1 -p 5433 -U postgres -d postgres -v ON_ERROR_STOP=1 -c \
            "CREATE DATABASE quantara_broker_test OWNER quantara;"
          psql -h 127.0.0.1 -p 5433 -U postgres -d postgres -v ON_ERROR_STOP=1 -c \
            "GRANT ALL PRIVILEGES ON DATABASE quantara_broker_test TO quantara;"
          psql -h 127.0.0.1 -p 5433 -U postgres -d quantara_broker_test -v ON_ERROR_STOP=1 -c \
            "GRANT ALL ON SCHEMA public TO quantara; GRANT CREATE ON SCHEMA public TO quantara;"

      - name: Apply broker test migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/quantara_broker_test
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5433/quantara_broker_test
        run: npm run db:migrate

      - name: Bootstrap broker test schema
        working-directory: apps/engine
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/quantara_broker_test
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5433/quantara_broker_test
          BROKER_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5433/postgres
          BROKER_TEST_MIGRATE_URL: postgresql://postgres:postgres@127.0.0.1:5433/quantara_broker_test
          BROKER_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/quantara_broker_test
          BROKER_TEST_ALLOW_MIGRATE_URL: "1"
        run: python tests/ci_bootstrap_broker.py

      - name: Run broker integration tests
        working-directory: apps/engine
        env:
          BROKER_TEST_REUSE: "1"
          BROKER_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/quantara_broker_test
        run: pytest tests/test_broker_execution_integration.py -v --tb=short
