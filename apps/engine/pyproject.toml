[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantara-engine"
version = "0.1.0"
description = "QUANTARA trading engine"
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0.36",
  "psycopg2-binary>=2.9.10",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "apscheduler>=3.10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["quantara_engine*", "quantara_workers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
